# TubeForge CI (ADR-0017). Free for public repositories on standard GitHub-hosted runners.
# Mocked providers only — no real API keys are ever used in CI.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PNPM_VERSION: "10.28.0"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python — lint, types, unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tubeforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tubeforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tubeforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TUBEFORGE_TEST_DATABASE_URL: postgresql+psycopg://tubeforge:ci-only-password@127.0.0.1:5432/tubeforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Traceability check
        run: uv run python tools/check_traceability.py
      - name: Dependency audit (Python)
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Licence check (Python)
        run: |
          uv run pip-licenses --format=json > py-licences.json
          uv run python tools/check_licenses.py --python py-licences.json

  web:
    name: Web — lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    # Write access is used only to commit refreshed visual snapshots (see "Refresh visual snapshots").
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tubeforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tubeforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tubeforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TUBEFORGE_DATABASE_URL: postgresql+psycopg://tubeforge:ci-only-password@127.0.0.1:5432/tubeforge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: pnpm -C apps/web install --frozen-lockfile
      - name: Generated API client is up to date (openapi.stub.json)
        run: pnpm -C apps/web api:check
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web test
      - run: pnpm -C apps/web build
      - name: Dependency audit (web)
        run: pnpm -C apps/web audit --audit-level high
      - name: Licence check (web)
        run: |
          pnpm -s -C apps/web licenses list --json --prod > web-licences.json
          uv run --frozen python tools/check_licenses.py --web web-licences.json
      - name: Start API serving the built dashboard
        env:
          # CI-only throwaway credentials (never real secrets): a random master key and an e2e owner.
          TUBEFORGE_OWNER_PASSWORD: correct horse battery staple 42
        run: |
          uv sync --frozen --no-dev
          KEY="$(head -c 32 /dev/urandom | base64)"
          echo "::add-mask::$KEY"
          echo "TUBEFORGE_MASTER_KEY=$KEY" >> "$GITHUB_ENV"
          export TUBEFORGE_MASTER_KEY="$KEY"
          uv run --no-dev tubeforge-db upgrade
          uv run --no-dev tubeforge-admin create-owner --email owner@example.com --name Owner
          mkdir -p "$RUNNER_TEMP/tf home"
          # Run the venv's script directly, not via `uv run`: a long-lived `uv run`
          # holds uv's cache lock, and setup-uv's post-job `uv cache prune` then
          # times out after 300 s and fails the job even when every test passed.
          TUBEFORGE_HOME="$RUNNER_TEMP/tf home" nohup .venv/bin/tubeforge-api > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/readyz
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: E2E (routes x states, axe, mobile, shell, visual)
        if: ${{ !(github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-snapshots]')) }}
        run: pnpm -C apps/web e2e
      # Visual baselines must be rendered on the CI runner itself (fonts/AA differ between machines).
      # A push to a non-main branch whose commit message contains [update-snapshots] runs the full
      # suite (everything must still pass), rewrites the screenshots and commits only that folder.
      - name: Refresh visual snapshots (commit message contains [update-snapshots])
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[update-snapshots]') }}
        run: |
          pnpm -C apps/web e2e --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then echo "snapshots unchanged"; exit 0; fi
          git commit -m "test(web): refresh visual snapshots rendered on the CI runner"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - if: failure()
        run: cat api.log
      - name: Keep Playwright results (snapshot diffs) when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
      - name: Stop API
        if: always()
        run: if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  windows:
    name: Windows — install into a path with spaces, queue + API smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      INSTALL_ROOT: 'C:\Tube Forge Test'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Copy repository into a path containing spaces
        run: |
          New-Item -ItemType Directory -Force -Path "$env:INSTALL_ROOT" | Out-Null
          Copy-Item -Recurse -Force -Path "$env:GITHUB_WORKSPACE" -Destination "$env:INSTALL_ROOT\app"
      - name: Start the runner's PostgreSQL and create a test database
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql -h 127.0.0.1 -U postgres -c "CREATE ROLE tubeforge LOGIN PASSWORD 'ci-only-password'"
          & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE tubeforge OWNER tubeforge"
          & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE tubeforge_test OWNER tubeforge"
      - name: PSScriptAnalyzer (errors only)
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path "$env:INSTALL_ROOT\app\infra\windows" -Severity Error
          $issues | Format-Table
          if ($issues) { exit 1 }
      - name: Doctor (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:INSTALL_ROOT\app\infra\windows\tubeforge.ps1" doctor -InstallRoot "$env:INSTALL_ROOT"
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0
      - name: Python environment + full test suite (incl. queue round-trip on Windows)
        working-directory: ${{ env.INSTALL_ROOT }}\app
        env:
          TUBEFORGE_TEST_DATABASE_URL: postgresql+psycopg://tubeforge:ci-only-password@127.0.0.1:5432/tubeforge_test
        run: |
          uv sync --frozen
          uv run pytest
      - name: Start / status / stop via tubeforge.ps1 (Windows PowerShell 5.1)
        shell: powershell
        env:
          TUBEFORGE_DATABASE_URL: postgresql+psycopg://tubeforge:ci-only-password@127.0.0.1:5432/tubeforge
        run: |
          $script = "$env:INSTALL_ROOT\app\infra\windows\tubeforge.ps1"
          Push-Location "$env:INSTALL_ROOT\app"
          & "$env:INSTALL_ROOT\app\.venv\Scripts\tubeforge-db.exe" upgrade
          # Real Windows Credential Manager (keyring WinVault backend), as on the owner's PC.
          & "$env:INSTALL_ROOT\app\.venv\Scripts\tubeforge-admin.exe" init-keys
          if ($LASTEXITCODE -ne 0) { Write-Error 'init-keys failed'; exit 1 }
          Pop-Location
          New-Item -ItemType Directory -Force -Path "$env:INSTALL_ROOT\config" | Out-Null
          & $script start -InstallRoot "$env:INSTALL_ROOT" -NonInteractive -NoBrowser
          # 6>&1: status writes with Write-Host (information stream), which a pipe does not capture otherwise.
          $statusOut = & $script status -InstallRoot "$env:INSTALL_ROOT" 6>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Host $statusOut
          Get-ChildItem "$env:INSTALL_ROOT\data\logs" | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 20 }
          # Regression guard: the memory figure must only count TubeForge's own processes
          # (a PID-reuse bug once counted 3.4 GB of unrelated processes).
          if ($statusOut -match 'TubeForge memory\s+(\d+) MB') {
            if ([int]$Matches[1] -gt 1500) { Write-Error "TubeForge memory $($Matches[1]) MB is implausible"; exit 1 }
          } else { Write-Error 'status printed no memory total'; exit 1 }
          & $script stop -InstallRoot "$env:INSTALL_ROOT"
          # stop must end TubeForge's processes and nothing else (this shell is still alive to check).
          Start-Sleep -Seconds 2
          $left = @(Get-Process -Name 'tubeforge-api', 'tubeforge-worker' -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) { Write-Error "processes left after stop: $($left.Id -join ', ')"; exit 1 }
          exit $status
