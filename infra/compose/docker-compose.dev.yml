# Linux developer/CI convenience only (ADR-0001: the owner's PC uses the native Windows install).
# Usage:
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#   export TUBEFORGE_DATABASE_URL=postgresql+psycopg://tubeforge:dev-only-password@127.0.0.1:5433/tubeforge
#   export TUBEFORGE_TEST_DATABASE_URL=postgresql+psycopg://tubeforge:dev-only-password@127.0.0.1:5433/tubeforge_test
#   uv run tubeforge-db upgrade && uv run tubeforge-api --reload
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tubeforge
      POSTGRES_PASSWORD: dev-only-password  # local throwaway container, never used on the owner's PC
      POSTGRES_DB: tubeforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tubeforge-pg:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tubeforge"]
      interval: 5s
      retries: 10

volumes:
  tubeforge-pg:
