[project]
name = "tubeforge"
version = "0.1.0"
description = "TubeForge — local-first, free-to-run, owner-directed AI YouTube production platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "procrastinate>=3.10,<3.11",
    "structlog>=26.1,<27",
    "argon2-cffi>=25,<26",
    "pyotp>=2.9,<3",
    "cryptography>=50.0.2,<51",
    "keyring>=25,<26",
    "segno>=1.6,<2",
    "zxcvbn>=4.5,<5",
    "httpx>=0.28,<0.29",
    "tzdata>=2025.2",
    "jsonschema-rs>=0.60,<0.61",
    "jinja2>=3.1,<4",
]

[project.scripts]
tubeforge-api = "tubeforge.cli:run_api"
tubeforge-worker = "tubeforge_workers.cli:main"
tubeforge-db = "tubeforge.cli:db_main"
tubeforge-admin = "tubeforge.admin:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<2",
    "pip-audit>=2.10,<3",
    "pip-licenses>=5,<6",
    "pre-commit>=4,<5",
    "schemathesis>=4,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/tubeforge", "workers/tubeforge_workers", "workers/tubeforge_agents", "workers/tubeforge_auditors"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
    "S101",    # assert is fine in tests
    "RUF001", "RUF002", "RUF003",  # typographic dashes/quotes in docs are intended
]

[tool.ruff.lint.isort]
known-first-party = ["tubeforge", "tubeforge_workers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test-only dummy passwords
"apps/api/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api", "workers"]
packages = ["tubeforge", "tubeforge_workers", "tubeforge_agents", "tubeforge_auditors"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
# zxcvbn ships no type information; it is only called in auth/passwords.py.
module = ["zxcvbn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "workers", "."]
markers = [
    "integration: needs a real PostgreSQL (TUBEFORGE_DATABASE_URL)",
    "media: needs ffmpeg/ffprobe",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
